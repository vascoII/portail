monolog:
  channels: ["http", "application", "soap", "transformer", "security"]

  handlers:
    # HTTP Channel - Request/Response logging
    http:
      type: stream
      path: "%kernel.logs_dir%/http.log"
      level: info
      channels: ["http"]
      formatter: monolog.formatter.json

    # Application Channel - UseCase logging
    application:
      type: stream
      path: "%kernel.logs_dir%/application.log"
      level: debug
      channels: ["application"]
      formatter: monolog.formatter.json

    # SOAP Channel - External service calls
    soap:
      type: stream
      path: "%kernel.logs_dir%/soap.log"
      level: warning
      channels: ["soap"]
      formatter: monolog.formatter.json

    # Transformer Channel - Data transformation
    transformer:
      type: stream
      path: "%kernel.logs_dir%/transformer.log"
      level: warning
      channels: ["transformer"]
      formatter: monolog.formatter.json

    # Security Channel - Authentication & authorization
    security:
      type: stream
      path: "%kernel.logs_dir%/security.log"
      level: info
      channels: ["security"]
      formatter: monolog.formatter.json

    # Main application log (everything else)
    main:
      type: fingers_crossed
      action_level: error
      handler: nested
      excluded_http_codes: [404, 405]
      channels: ["!http", "!application", "!soap", "!transformer", "!security"]

    nested:
      type: stream
      path: "%kernel.logs_dir%/app.log"
      level: debug
      formatter: monolog.formatter.json

when@dev:
  monolog:
    handlers:
      # In dev, log everything to console for easier debugging
      console:
        type: console
        level: debug
        channels: ["http", "application", "soap", "transformer", "security"]
        formatter: monolog.formatter.custom_line

when@prod:
  monolog:
    handlers:
      # In production, use rotating files and higher thresholds
      http:
        type: rotating_file
        path: "%kernel.logs_dir%/http.log"
        level: info
        max_files: 30
        channels: ["http"]
        formatter: monolog.formatter.json

      application:
        type: rotating_file
        path: "%kernel.logs_dir%/application.log"
        level: info
        max_files: 30
        channels: ["application"]
        formatter: monolog.formatter.json

      soap:
        type: rotating_file
        path: "%kernel.logs_dir%/soap.log"
        level: warning
        max_files: 30
        channels: ["soap"]
        formatter: monolog.formatter.json

      transformer:
        type: rotating_file
        path: "%kernel.logs_dir%/transformer.log"
        level: warning
        max_files: 30
        channels: ["transformer"]
        formatter: monolog.formatter.json

      security:
        type: rotating_file
        path: "%kernel.logs_dir%/security.log"
        level: info
        max_files: 30
        channels: ["security"]
        formatter: monolog.formatter.json
