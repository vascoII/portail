# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Http\Action\:
    resource: "../src/Http/Action"
    tags: ["controller.service_arguments"]

  # Pour utiliser BDD
  App\Service\ImmeubleProviderInterface: '@App\Service\Internal\ImmeubleService'

  # Pour utiliser SOAP
  App\Service\ImmeubleSoapProviderInterface: '@App\Service\External\ImmeubleSoapService'

  # JWT Configuration
  App\Domain\Service\Jwt\JwtServiceInterface: '@App\Infrastructure\Service\Jwt\JwtService'
  App\Infrastructure\Service\Jwt\JwtService:
    arguments:
      $jwtSecret: "%env(JWT_SECRET)%"
      $jwtExpiration: "%env(int:JWT_EXPIRATION)%"

  # Redis Configuration
  App\Domain\Service\Redis\RedisServiceInterface: '@App\Infrastructure\Service\Redis\RedisService'
  App\Infrastructure\Service\Redis\RedisService:
    arguments:
      $redis: "@redis_client"

  # Redis Client
  redis_client:
    class: Predis\Client
    arguments:
      - "%env(REDIS_URL)%"

  # Auth Service
  App\Domain\Service\Auth\AuthServiceInterface: '@App\Infrastructure\Service\Auth\AuthService'

  # SOAP Client
  App\Infrastructure\Service\Soap\SoapClient:
    arguments:
      $wsdlUrl: "%env(SOAP_WSDL_URL)%"

  # JWT Middleware
  App\Http\Middleware\JwtAuthMiddleware:
    tags:
      - {
          name: kernel.event_listener,
          event: kernel.request,
          method: __invoke,
          priority: 1000,
        }

  # Logger Processors
  App\Infrastructure\Logger\Processor\RequestIdProcessor:
    tags: ['monolog.processor']
    
  App\Infrastructure\Logger\Processor\UserContextProcessor:
    tags: ['monolog.processor']
    
  App\Infrastructure\Logger\Processor\SensitiveDataProcessor:
    tags: ['monolog.processor']

  # HTTP Logging Subscriber
  App\Infrastructure\Logger\Subscriber\HttpLoggingSubscriber:
    tags: ['kernel.event_subscriber']
    arguments:
      $httpLogger: '@monolog.logger.http'

  # Security Logger for JWT Middleware
  App\Http\Middleware\JwtAuthMiddleware:
    arguments:
      $securityLogger: '@monolog.logger.security'

  # HTTP Logger for JsonResponder
  App\Http\Responder\JsonResponder:
    arguments:
      $httpLogger: '@monolog.logger.http'
