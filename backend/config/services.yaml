# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
  App\Http\Middleware\UserTypeAuthorizationMiddleware:
    tags:
      - { name: kernel.event_listener, event: kernel.request, priority: 10 }
    arguments:
      $authorizationService: '@App\Application\Service\AuthorizationService'
      $securityLogger: "@monolog.logger.security"
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Http\Action\:
    resource: "../src/Http/Action"
    tags: ["controller.service_arguments"]

  # Pour utiliser BDD
  App\Service\ImmeubleProviderInterface: '@App\Service\Internal\ImmeubleService'

  # Pour utiliser SOAP
  App\Service\ImmeubleSoapProviderInterface: '@App\Service\External\ImmeubleSoapService'

  # Pour utiliser DataProvider
  App\Application\Service\DataSource\GestionParcDataSourceInterface: '@App\Infrastructure\Service\DataSource\GestionParcDataSource'

  # JWT Configuration
  App\Domain\Service\Jwt\JwtServiceInterface: '@App\Infrastructure\Service\Jwt\JwtService'
  App\Infrastructure\Service\Jwt\JwtService:
    arguments:
      $jwtSecret: "%env(JWT_SECRET)%"
      $jwtExpiration: "%env(int:JWT_EXPIRATION)%"

  # Redis Configuration
  App\Domain\Service\Redis\RedisServiceInterface: '@App\Infrastructure\Service\Redis\RedisService'
  App\Infrastructure\Service\Redis\RedisService:
    arguments:
      $redis: "@redis_client"

  # Redis Client
  redis_client:
    class: Predis\Client
    arguments:
      - "%env(REDIS_URL)%"

  # Auth Service
  App\Domain\Service\Auth\AuthServiceInterface: '@App\Infrastructure\Service\Auth\AuthService'

  # SOAP Client
  App\Infrastructure\Service\DataSource\SoapClient:
    arguments:
      $wsdlUrl: "%env(SOAP_WSDL_URL)%"
      $debug: false
      $processors:
        - '@App\Infrastructure\Service\DataSource\ResponseProcessor\ObjectResponseProcessor'
        - '@App\Infrastructure\Service\DataSource\ResponseProcessor\StringResponseProcessor'
        - '@App\Infrastructure\Service\DataSource\ResponseProcessor\BoolResponseProcessor'

  # JWT Middleware
  App\Http\Middleware\JwtAuthMiddleware:
    arguments:
      $securityLogger: "@monolog.logger.security"
    tags:
      - {
          name: kernel.event_listener,
          event: kernel.request,
          method: __invoke,
          priority: 10,
        }

  # Logger Processors
  App\Infrastructure\Logger\Processor\RequestIdProcessor:
    tags: ["monolog.processor"]

  App\Infrastructure\Logger\Processor\UserContextProcessor:
    tags: ["monolog.processor"]

  App\Infrastructure\Logger\Processor\SensitiveDataProcessor:
    tags: ["monolog.processor"]

  App\Infrastructure\Logger\Processor\ExceptionContextProcessor:
    tags: ["monolog.processor"]

  # HTTP Logging Subscriber
  App\Infrastructure\Logger\Subscriber\HttpLoggingSubscriber:
    tags: ["kernel.event_subscriber"]
    arguments:
      $httpLogger: "@monolog.logger.http"

  # HTTP Logger for JsonResponder
  App\Http\Responder\JsonResponder:
    arguments:
      $httpLogger: "@monolog.logger.http"

  # HTTP Logger for PdfResponder
  App\Http\Responder\PdfResponder:
    arguments:
      $httpLogger: "@monolog.logger.http"

  # HTTP Event Listeners
  App\Http\EventListener\GlobalExceptionListener:
    tags: ["kernel.event_subscriber"]
    arguments:
      $logger: "@monolog.logger.application"

  App\Http\EventListener\RequestIdListener:
    tags: ["kernel.event_subscriber"]

  # CORS is handled by Nelmio CORS bundle
  # App\Http\EventListener\CorsListener:
  #   tags: ["kernel.event_subscriber"]
  #   arguments:
  #     $allowedOrigins: ["*"]
  #     $allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  #     $allowedHeaders: ["Content-Type", "Authorization", "X-Request-ID"]
  #     $allowCredentials: false
  #     $maxAge: 3600

  App\Http\EventListener\SecurityHeadersListener:
    tags: ["kernel.event_subscriber"]
    arguments:
      $enableSecurityHeaders: true
      $contentSecurityPolicy: "default-src 'self'"
      $enableHsts: true
      $hstsMaxAge: 31536000
      $enableFrameOptions: true
      $frameOptions: "DENY"
      $enableContentTypeOptions: true
      $enableReferrerPolicy: true
      $referrerPolicy: "strict-origin-when-cross-origin"

  App\Http\EventListener\RateLimitListener:
    tags: ["kernel.event_subscriber"]
    arguments:
      $logger: "@monolog.logger.security"
      $defaultLimit: 100
      $defaultWindow: 3600
      $endpointLimits: []
      $enableRateLimiting: true

  App\Http\EventListener\RequestValidationListener:
    tags: ["kernel.event_subscriber"]
    arguments:
      $logger: "@monolog.logger.http"
      $maxRequestSize: 10485760
      $allowedContentTypes:
        ["application/json", "application/x-www-form-urlencoded"]
      $enableValidation: true

  App\Http\EventListener\ResponseTimeListener:
    tags: ["kernel.event_subscriber"]
    arguments:
      $logger: "@monolog.logger.http"
      $slowRequestThreshold: 1.0
      $enableResponseTimeLogging: true

  #Http Event ExceptionListener
  App\Http\EventListener\ExceptionListener:
    tags:
      - { name: kernel.event_listener, event: kernel.exception }

  #Monolog Custom formater
  monolog.formatter.custom_line:
    class: Monolog\Formatter\LineFormatter
    arguments:
      $format: "[%%datetime%%] %%channel%%.%%level_name%%: %%message%% %%context%% %%extra%%\n"
      $dateFormat: "Y-m-d H:i:s"

  #Responder for each Action (JsonResponse, pdfResponse)
  #Document
  App\Http\Action\Document\Pdf\:
    resource: "../src/Http/Action/Document/Pdf/*"
    arguments:
      $responder: '@App\Http\Responder\PdfResponder'
  App\Http\Action\Document\Excel\:
    resource: "../src/Http/Action/Document/Excel/*"
    arguments:
      $responder: '@App\Http\Responder\ExcelResponder'

  #External
  App\Http\Action\External\Document\GenerateReportByTokenPdfAction:
    arguments:
      $responder: '@App\Http\Responder\PdfResponder'
  App\Http\Action\External\Document\ReceiveGeneratedDocumentAction:
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'    
  App\Http\Action\External\Releve\GenerateReleveAction:
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'
  App\Http\Action\External\Suivi\ListWorkOrdersAction:
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'
  App\Http\Action\External\Suivi\GetWorkOrderAction:
    arguments:
      $responder: '@App\Http\Responder\JsonResponder' 
  App\Http\Action\External\Suivi\GenerateWorkOrderDetailsPdfAction:      
    arguments:
      $responder: '@App\Http\Responder\PdfResponder'   

  #Facture
  App\Http\Action\Facture\:
    resource: "../src/Http/Action/Facture/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Immeuble
  App\Http\Action\Immeuble\:
    resource: "../src/Http/Action/Immeuble/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder' 

  #Logement
  App\Http\Action\Logement\:
    resource: "../src/Http/Action/Logement/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Occupant
  App\Http\Action\Occupant\:
    resource: "../src/Http/Action/Occupant/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Operator
  App\Http\Action\Operator\:
    resource: "../src/Http/Action/Operator/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Parc
  App\Http\Action\Parc\:
    resource: "../src/Http/Action/Parc/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Security
  App\Http\Action\Security\:
    resource: "../src/Http/Action/Security/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Ticket
  App\Http\Action\Ticket\:
    resource: "../src/Http/Action/Ticket/*"
    arguments:
      $responder: '@App\Http\Responder\JsonResponder'

  #Hydrator
  App\Infrastructure\Service\Hydrator\Hydrator:
    autowire: true
    autoconfigure: true
    arguments:
      $superLoginID: "%env(SUPER_LOGIN_ID)%"
      $superPassword: "%env(SUPER_PASSWORD)%"
      $adminSessionId: "%env(ADMIN_SESSION_ID)%"

  # DocumentHydrator
  App\Infrastructure\Service\Hydrator\DocumentHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # ExternalHydrator
  App\Infrastructure\Service\Hydrator\ExternalHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # ImmeubleHydrator
  App\Infrastructure\Service\Hydrator\ImmeubleHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # InterventionHydrator
  App\Infrastructure\Service\Hydrator\InterventionHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # LogementHydrator
  App\Infrastructure\Service\Hydrator\LogementHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # OccupantHydrator
  App\Infrastructure\Service\Hydrator\OccupantHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # OperatorHydrator
  App\Infrastructure\Service\Hydrator\OperatorHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # ParcHydrator
  App\Infrastructure\Service\Hydrator\ParcHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # SecurityHydrator
  App\Infrastructure\Service\Hydrator\SecurityHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # SharedHydrator
  App\Infrastructure\Service\Hydrator\SharedHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true
  # TicketHydrator
  App\Infrastructure\Service\Hydrator\TicketHydrator:
      parent: App\Infrastructure\Service\Hydrator\Hydrator
      autowire: true
      autoconfigure: true


  #ResponseProcessor
  App\Infrastructure\Service\DataSource\ResponseProcessor\ObjectResponseProcessor: ~
  App\Infrastructure\Service\DataSource\ResponseProcessor\StringResponseProcessor: ~
  App\Infrastructure\Service\DataSource\ResponseProcessor\BoolResponseProcessor: ~

  #Validator
  App\Application\Validator\Input\Operator\CreateOperatorInputValidator:
    autowire: true
    autoconfigure: true
    public: false

  #Aliases
  App\Http\Responder\ResponderInterface: '@App\Http\Responder\JsonResponder'

  # GenerateDocumentPdfUseCase
  App\Application\UseCase\Document\GenerateDocumentPdfUseCase:
    arguments:
      $callBackUrlBase: "%env(CALLBACK_URL_BASE)%"

  # DocumentStorage
  App\Infrastructure\Service\Storage\DocumentStorage:    
    arguments:
      $storagePath: "%env(DOCUMENT_STORAGE_PATH)%"
      $publicUrlPrefix: "%env(DOCUMENT_URL_PREFIX)%"